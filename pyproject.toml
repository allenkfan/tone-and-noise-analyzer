[project]
name = "tone-and-noise-analyzer"
version = "0.1.0"
description = "Emotional tone and background-noise analysis for call audio"
requires-python = "==3.12.*"
dependencies = [
    "google-genai>=2.31.0",
    "gradio>=5",
    "numpy>=2",
    "onnxruntime>=1.23,<1.24",
    "pydantic>=2",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
