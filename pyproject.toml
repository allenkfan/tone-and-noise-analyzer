[project]
name = "tone-and-noise-analyzer"
version = "0.1.0"
description = "Emotional tone and background-noise analysis for call audio"
requires-python = "==3.12.*"
dependencies = [
    "google-genai>=2.31.0",
    "gradio>=5",
    "huggingface-hub>=1",
    # torch stops at 2.2.2 on Intel Macs, which needs numpy 1.x. The Space (Linux) gets
    # torch from the CPU-only index.
    "numpy>=2; sys_platform == 'linux'",
    "numpy>=1.26,<2; sys_platform == 'darwin'",
    "onnxruntime>=1.23,<1.24",
    "pydantic>=2",
    "python-dotenv>=1",
    "safetensors>=0.4",
    "torch==2.5.1; sys_platform == 'linux'",
    "torch==2.2.2; sys_platform == 'darwin'",
    "torchaudio==2.5.1; sys_platform == 'linux'",
    "torchaudio==2.2.2; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
